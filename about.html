        <h1>关于未完稿</h1>
        <p class="dek">一个用来整理问题、记录大学生活的地方。</p>
      </header>
      <p>我对数学和计算机系统感兴趣。平时学 C、读《深入理解计算机系统》，也想弄清一道数学题究竟是怎么想到的。遇到值得回头看的问题，就在这里留一篇笔记。</p>
      <h2>这里会写些什么？</h2>
      <ul>
        <li><strong>随笔</strong>。记一些上课之外的事，也记读到的书和做过的尝试。</li>
        <li><strong>数学</strong>。把容易算错或绕远的题重新做一遍，写清楚哪一步改变了做法。</li>
        <li><strong>编程</strong>。用尽量小的例子验证一个概念，顺手记下调试的过程。</li>
      </ul>
      <p>有些问题写完还能接着想，有些理解过一阵子会变。这也是把博客叫作「未完稿」的原因。</p>
